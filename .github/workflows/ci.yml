name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web Lint / Build / E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/web/package-lock.json

      - name: Install root dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Install web dependencies
        run: npm ci

      - name: Install contracts dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}/packages/contracts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Production server tests
        run: npm run test:server

      - name: Production dependency audit
        run: npm run audit:prod
        working-directory: ${{ github.workspace }}

      - name: Typecheck portable services
        run: npm run typecheck:services
        working-directory: ${{ github.workspace }}

      - name: Test portable Core and services
        run: npm run test:core
        working-directory: ${{ github.workspace }}

      - name: Test installable SDK package
        run: npm run test:sdk-package
        working-directory: ${{ github.workspace }}

      - name: Test adapter contracts
        run: npm run test:adapters
        working-directory: ${{ github.workspace }}

      - name: Test Mini Program cloud functions
        run: npm run test:miniprogram-cloud
        working-directory: ${{ github.workspace }}

      - name: Test Mini Program page logic
        run: npm run test:miniprogram-pages
        working-directory: ${{ github.workspace }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright desktop and mobile tests
        run: npx playwright test --project=chromium --project=mobile-chrome

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7

  contracts:
    name: Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: packages/contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat build --force

      - name: Run tests
        run: npm test

  # Static compile-equivalent gate for the WeChat Mini Program.
  # Pinned while §4.2 (DevTools + device verification) is blocked:
  # runs the same checks the owner has been doing by hand, so a future
  # regression (missing page file, broken usingComponents, syntax error
  # in a page util / cloudfunction, missing custom-tab-bar, etc.) shows
  # up here instead of inside DevTools. See scripts/README-VERIFY-STATIC.md.
  verify-miniprogram-static:
    name: Mini Program Static Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run static verify (JSON / pages / usingComponents / node --check / tab-bar / cloud entries)
        # exit code drives step status: red CI on any regression. JSON report
        # is captured to a file regardless and uploaded as an artifact below.
        run: |
          npm run verify:miniprogram:static 2>verify-miniprogram-static.json
        continue-on-error: false

      - name: Upload verify report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-miniprogram-static-report
          path: verify-miniprogram-static.json
          retention-days: 7
          if-no-files-found: ignore
