<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="vibecard" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="vibecard" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnstatic.tencentcs.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https: wss:; font-src 'self'; manifest-src 'self'; frame-src 'self'; media-src 'self' https:; worker-src 'self';" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>VibeCard — 一张会越来越懂你的 AI 名片</title>
    <meta name="description" content="和你的私人 Vibe 聊天、确认它记住的内容，再让访客通过你的 AI 名片真正理解你。" />
    <meta property="og:title" content="VibeCard — 先理解，再认识" />
    <meta property="og:description" content="一张会越来越懂你的 AI 名片。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VibeCard — 先理解，再认识" />
    <meta name="twitter:description" content="一张会越来越懂你的 AI 名片。" />
    <style>
      /* Prevent flash before React mounts; lock the body to viewport on mobile */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      body { background: #ffffff; color: #0a0a0a; -webkit-tap-highlight-color: transparent; }
      html.dark body { background: #0a0a0a; color: #fafafa; }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #fafafa; }
      }
      #root { min-height: 100vh; min-height: 100svh; }
    </style>
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('vibecard_theme') || 'system';
          const root = document.documentElement;
          root.classList.remove('light', 'dark');
          if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            root.classList.add('dark');
          } else if (theme === 'light') {
            root.classList.add('light');
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
